# Quick-test model on northern-hemisphere SIC plus CS2SMOS sea-ice thickness, trained
# and evaluated on freeze-season (Nov-Mar) windows only.
# For a SIC-only baseline on the same split, override:
#   '~variables.input.sit-cs2smos'
# Note: with Nov-Mar-only training periods the calendar-day climatology cannot be
# built (Apr-Oct days have no data), so climatology-based metrics and
# `model=climatology` are unavailable with this config.
defaults:
  - base
  - override /data: sample_north_sit
  - override /variables: sic-ssmis-sit-cs2smos
  - override /window: forecast-7-history-2
  - _self_

# Encode thickness with the same encoder the chosen model uses for SIC, so any
# encode-process-decode `model=` choice works without modifying existing model configs.
# Models without per-group encoders (persistence, climatology, ddpm) are not supported.
model:
  encoders:
    sit-cs2smos: ${model.encoders.sic-ssmis}
