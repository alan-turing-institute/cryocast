_target_: cryocast.models.EncodeProcessDecode

name: dc-unet-dc

encoders:
  latent_space: [144, 144]
  era5:
    _target_: cryocast.models.encoders.DeepCompressionEncoder
    attention_heads: {1: 6}
    hid_channels: [96, 192]
    hid_blocks: [3, 3]
    latent_channels: 96
    pixel_shuffle: true
    stride: 3
  float-argo:
    _target_: cryocast.models.encoders.DeepCompressionEncoder
    hid_channels: [16, 32]
    hid_blocks: [1, 1]
    latent_channels: 8
    pixel_shuffle: true
    stride: 3
  sic-osisaf:
    _target_: cryocast.models.encoders.DeepCompressionEncoder
    hid_channels: [24, 48]
    hid_blocks: [1, 1]
    latent_channels: 8
    pixel_shuffle: true
    stride: 3
  sic-ssmis:
    _target_: cryocast.models.encoders.DeepCompressionEncoder
    hid_channels: [24, 48]
    hid_blocks: [1, 1]
    latent_channels: 16
    pixel_shuffle: true
    stride: 3

processor:
  _target_: cryocast.models.processors.UNetProcessor
  kernel_size: 5
  norm_type: groupnorm
  start_out_channels: 176

decoder:
  _target_: cryocast.models.decoders.DeepCompressionDecoder
  attention_heads: {1: 4}
  hid_channels: [64, 128]
  hid_blocks: [2, 2]
  pixel_shuffle: false
  stride: 3

finaliser:
  mask_type: active
  restrict_range: sigmoid
  skip_connection:
    method: additive

# Rollout stabilisation. Both options are off by default. To enable them, uncomment
# them here, or add them on the command line with a "+" prefix, for example
# "+model.skip_anchor=previous +model.relaxation.tau=30".
# skip_anchor: previous # initial | previous. Default: initial (latent), previous (physical)
# relaxation:           # Relax each forecast step towards climatology
#   tau: 30.0           # Folding time of the anomaly, in forecast steps
#   apply_in_training: true
