_target_: cryocast.models.EncodeProcessDecode

name: dc-ddpm-dc

# In single-stage training and in the finetune stage, the processor calculates
# its loss in latent space. Additional loss terms let these modes also train the
# encoders and the decoder.
# loss = latent_loss + w_prediction * prediction_loss + w_reconstruction * reconstruction_loss
loss_weights:
  prediction: 1.0
  reconstruction: 1.0

encoders:
  latent_space: [144, 144]
  era5:
    _target_: cryocast.models.encoders.DeepCompressionEncoder
    attention_heads: {1: 6}
    hid_channels: [96, 192]
    hid_blocks: [3, 3]
    latent_channels: 96
    pixel_shuffle: true
    stride: 3
  float-argo:
    _target_: cryocast.models.encoders.DeepCompressionEncoder
    hid_channels: [16, 32]
    hid_blocks: [1, 1]
    latent_channels: 8
    pixel_shuffle: true
    stride: 3
  sic-icenet:
    _target_: cryocast.models.encoders.DeepCompressionEncoder
    hid_channels: [16, 32]
    hid_blocks: [1, 1]
    latent_channels: 2
    pixel_shuffle: true
    stride: 3
  sic-osisaf:
    _target_: cryocast.models.encoders.DeepCompressionEncoder
    hid_channels: [24, 48]
    hid_blocks: [1, 1]
    latent_channels: 4
    pixel_shuffle: true
    stride: 3
  sic-ssmis:
    _target_: cryocast.models.encoders.DeepCompressionEncoder
    hid_channels: [24, 48]
    hid_blocks: [1, 1]
    latent_channels: 16
    pixel_shuffle: true
    stride: 3

processor:
  _target_: cryocast.models.processors.DiffusionProcessor
  timesteps: 250     # best in the sweep; 100 or 150 also did well and validate faster
                     # (validation runs DDPM over all timesteps), so lower it if training time is limited
  ddim_steps: null   # null = all 250 timesteps -> DDPM sampling
  eta: 1.0           # with ddim_steps=null, gives standard DDPM
  # For evaluation, DDIM with ddim_steps: 100, eta: 1.0 is recommended: as good as full DDPM
  # (within noise) with 2.5x fewer steps. To evaluate a trained run with DDIM, see the
  # DiffusionProcessor docstring (cryocast/models/processors/diffusion.py).
  beta_schedule: cosine
  start_out_channels: 32
  time_embed_dim: 256
  dropout_rate: 0.05
  use_autoregressive: true
  loss: ${loss}

decoder:
  _target_: cryocast.models.decoders.DeepCompressionDecoder
  attention_heads: {1: 4}
  hid_channels: [64, 128]
  hid_blocks: [2, 2]
  pixel_shuffle: true
  stride: 3

finaliser:
  mask_type: active
  restrict_range: sigmoid
  skip_connection:
    method: additive

# Rollout stabilisation. Both options are off by default. To enable them, uncomment
# them here, or add them on the command line with a "+" prefix, for example
# "+model.skip_anchor=previous +model.relaxation.tau=30".
# skip_anchor: previous # initial | previous. Default: initial (latent), previous (physical)
# relaxation:           # Relax each forecast step towards climatology
#   tau: 30.0           # Folding time of the anomaly, in forecast steps
#   apply_in_training: true
