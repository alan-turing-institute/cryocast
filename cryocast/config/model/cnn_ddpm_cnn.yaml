_target_: cryocast.models.EncodeProcessDecode

name: cnn-ddpm-cnn

encoders:
  latent_space: [144, 144]
  sic-osisaf:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3
  sic-ssmis:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3
  era5:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3
  float-argo:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3

processor:
  _target_: cryocast.models.processors.DiffusionProcessor
  timesteps: 250     # best in the sweep; 100 or 150 also did well and validate faster
                     # (validation runs DDPM over all timesteps), so lower it if training time is limited
  ddim_steps: null   # null = all 250 timesteps -> DDPM sampling
  eta: 1.0           # with ddim_steps=null, gives standard DDPM
  # For evaluation, DDIM with ddim_steps: 100, eta: 1.0 is recommended: as good as full DDPM
  # (within noise) with 2.5x fewer steps. To evaluate a trained run with DDIM, see the
  # DiffusionProcessor docstring (cryocast/models/processors/diffusion.py).
  beta_schedule: cosine
  start_out_channels: 64
  time_embed_dim: 256
  dropout_rate: 0.025
  use_autoregressive: true
  loss: ${loss}

decoder:
  _target_: cryocast.models.decoders.CNNDecoder
  kernel_size: 5
  mask_type: active
  n_layers: 1
  n_subblocks: 3
  norm_type: groupnorm
  restrict_range: sigmoid
  scale_factor: 3
  zero_init_output: true
  skip_connection:
    method: additive
