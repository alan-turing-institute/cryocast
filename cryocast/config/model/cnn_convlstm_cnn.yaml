_target_: cryocast.models.EncodeProcessDecode

name: cnn-convlstm-cnn

encoders:
  latent_space: [144, 144]
  era5:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3
  float-argo:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3
  sic-icenet:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3
  sic-osisaf:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3
  sic-ssmis:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3
  sit-cs2smos:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3

processor:
  _target_: cryocast.models.processors.ConvLSTMProcessor
  hidden_channels: 128
  kernel_size: 3
  n_layers: 3
  dropout: 0.0
  residual: false

decoder:
  _target_: cryocast.models.decoders.CNNDecoder
  kernel_size: 5
  n_layers: 1
  norm_type: groupnorm
  scale_factor: 3

finaliser:
  mask_type: active
  restrict_range: sigmoid
  skip_connection:
    method: additive
