_target_: cryocast.models.EncodeProcessDecode

name: cnn-gsta-cnn

encoders:
  latent_space: [216, 216]
  era5:
    _target_: cryocast.models.encoders.CNNEncoder
    n_layers: 1
  float-argo:
    _target_: cryocast.models.encoders.CNNEncoder
    n_layers: 1
  sic-osisaf:
    _target_: cryocast.models.encoders.CNNEncoder
    n_layers: 1
  sic-ssmis:
    _target_: cryocast.models.encoders.CNNEncoder
    n_layers: 1
  sit-cs2smos:
    _target_: cryocast.models.encoders.CNNEncoder
    n_layers: 1

processor:
  _target_: cryocast.models.processors.GSTAProcessor
  kernel_size: 15
  hid_channels: 256
  n_blocks: 6

decoder:
  _target_: cryocast.models.decoders.CNNDecoder
  n_layers: 1
  norm_type: groupnorm

finaliser:
  mask_type: active
  restrict_range: sigmoid
  skip_connection:
    method: additive
