_target_: cryocast.models.EncodeProcessDecode

name: cnn-unet-cnn

encoders:
  latent_space: [144, 144]
  era5:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3
  float-argo:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3
  sic-osisaf:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3
  sic-ssmis:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3

processor:
  _target_: cryocast.models.processors.UNetProcessor
  norm_type: groupnorm
  start_out_channels: 64
  kernel_size: 3

decoder:
  _target_: cryocast.models.decoders.CNNDecoder
  kernel_size: 5
  n_layers: 1
  norm_type: groupnorm
  scale_factor: 3

finaliser:
  mask_type: active
  restrict_range: sigmoid
  skip_connection:
    method: additive

# Rollout stabilisation. Both options are off by default. To enable them, uncomment
# them here, or add them on the command line with a "+" prefix, for example
# "+model.skip_anchor=previous +model.relaxation.tau=30".
# skip_anchor: previous # initial | previous. Default: initial (latent), previous (physical)
# relaxation:           # Relax each forecast step towards climatology
#   tau: 30.0           # Folding time of the anomaly, in forecast steps
#   apply_in_training: true
