_target_: cryocast.models.EncodeProcessDecode

name: cnn-unet-cnn

encoders:
  latent_space: [144, 144]
  era5:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3
  float-argo:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3
  sic-osisaf:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3
  sic-ssmis:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3

processor:
  _target_: cryocast.models.processors.UNetProcessor
  norm_type: groupnorm
  start_out_channels: 64
  kernel_size: 3

decoder:
  _target_: cryocast.models.decoders.CNNDecoder
  kernel_size: 5
  n_layers: 1
  norm_type: groupnorm
  scale_factor: 3

finaliser:
  mask_type: active
  restrict_range: sigmoid
  skip_connection:
    method: additive

# Rollout stabilisation (skip_anchor, relaxation): see docs/src/user-guide/forecast-rollout.md
