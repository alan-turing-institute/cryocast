_target_: cryocast.models.EncodeProcessDecode

name: cnn-ddim-cnn

# In single-stage training and in the finetune stage, the processor calculates
# its loss in latent space. Additional loss terms let these modes also train the
# encoders and the decoder.
# loss = latent_loss + w_prediction * prediction_loss + w_reconstruction * reconstruction_loss
loss_weights:
  prediction: 1.0
  reconstruction: 1.0

encoders:
  latent_space: [144, 144]
  sic-osisaf:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3
  sic-ssmis:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3
  sic-icenet:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3
  era5:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3
  float-argo:
    _target_: cryocast.models.encoders.CNNEncoder
    kernel_size: 5
    n_layers: 1
    scale_factor: 3

processor:
  _target_: cryocast.models.processors.DiffusionProcessor
  timesteps: 1000
  ddim_steps: 50
  eta: 0.0
  beta_schedule: cosine
  start_out_channels: 48
  time_embed_dim: 256
  dropout_rate: 0.05
  use_autoregressive: true
  prediction_loss_cutoff: 0.5
  loss: ${loss}

decoder:
  _target_: cryocast.models.decoders.CNNDecoder
  kernel_size: 5
  n_layers: 1
  n_subblocks: 3
  norm_type: groupnorm
  scale_factor: 3
  zero_init_output: true

finaliser:
  mask_type: active
  restrict_range: sigmoid
  skip_connection:
    method: additive

# Rollout stabilisation (skip_anchor, relaxation): see docs/src/user-guide/forecast-rollout.md
