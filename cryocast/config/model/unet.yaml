_target_: cryocast.models.EncodeProcessDecode

name: unet

encoders:
  latent_space: [432, 432]
  era5:
    _target_: cryocast.models.encoders.NaiveLinearEncoder
  float-argo:
    _target_: cryocast.models.encoders.NaiveLinearEncoder
  sic-osisaf:
    _target_: cryocast.models.encoders.NaiveLinearEncoder
  sic-ssmis:
    _target_: cryocast.models.encoders.NaiveLinearEncoder

processor:
  _target_: cryocast.models.processors.UNetProcessor
  kernel_size: 7
  start_out_channels: 128

decoder:
  _target_: cryocast.models.decoders.NaiveLinearDecoder
  mask_type: active
  restrict_range: none
  skip_connection:
    method: additive
