defaults:
  - datasets:
    - nbsamp_sicnorth_osisaf_25p0km_2003_2003_24h_v1
    - nbsamp_sicnorth_osisaf_25p0km_2010_2010_24h_v1
    - nbsamp_sicnorth_osisaf_25p0km_2018_2018_24h_v1
  - split: sample_dataset
  - _self_

# Input groups (group_as names) that may be missing on some days. Their missing days
# hold optional_fill, in normalised units: real data lies in [0, 1], so -1 marks a
# missing day. With [] nothing changes.
optional_groups: []
optional_fill: -1.0
