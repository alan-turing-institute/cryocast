defaults:
  - datasets:
    - demo_sicnorth_osisaf_25p0km_2017_2019_24h_v1
    - demo_weathernorth_era5_0p5_2017_2019_24h_v1
  - split: demo_dataset
  - _self_

# Input groups (group_as names) that may be missing on some days: their missing days
# are filled with optional_fill ("mean", "climatology" or a number, in normalised units)
# and a flag_filled channel is added (1 on filled days). With [] nothing changes.
optional_groups: []
optional_fill: mean
