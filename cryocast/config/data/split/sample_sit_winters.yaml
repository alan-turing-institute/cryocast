# Freeze-season-only (Nov-Mar) split for winter-only sea-ice thickness products such as
# CS2SMOS. Each winter is listed as its own period so that runs with and without the
# thickness inputs use the same windows (as long as the thickness data has no gaps
# within Nov-Mar beyond those already missing from the SIC data).
predict:
  - start: null
    end: null

test:
  - start: 2022-11-01
    end: 2023-03-31

train:
  - start: 2019-11-01
    end: 2020-03-31
  - start: 2020-11-01
    end: 2021-03-31

validate:
  - start: 2021-11-01
    end: 2022-03-31
