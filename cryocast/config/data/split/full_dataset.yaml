# This data is a holdout set not to be used until we are ready to produce final outputs (e.g. a paper)
# Data from 2025 (1 year)
predict:
  - start: 2025-01-01
    end: 2025-12-31

# This data is an evaluation set used to compare fully-trained models (e.g. for releases)
# Data from 2024 (1 year)
test:
  - start: 2024-01-01
    end: 2024-12-31

# This data is used for training the model
# Data from 1979-2021 (43 years)
train:
  - start: null
    end: 2021-12-31

# This data is used for validation during training (e.g. for early stopping etc.)
# Data from 2022 and 2023 (2 years)
validate:
  - start: 2022-01-01
    end: 2023-12-31
