# @package _global_
defaults:
  - /base
  - override /model: cnn_vit_cnn
  - _self_

# Custom learning rate and weight decay
train:
  # Fits in two multistage 24h JASMIN A100 jobs with forecast-14-history-3, batch_size 1, bf16
  # First job: encoders (39 min/epoch), decoder (16 min/epoch)
  # Second job: processor (43 min/epoch), finetune (44 min/epoch)
  multistage:
    encoders:
      scheduler:
        T_max: 23
      trainer:
        max_epochs: 23
    decoder:
      scheduler:
        T_max: 23
      trainer:
        max_epochs: 23
    processor:
      scheduler:
        T_max: 15
      trainer:
        max_epochs: 15
    finetune:
      optimizer:
        lr: 5.0e-5  # 0.1 * learning rate used elsewhere
      scheduler:
        T_max: 14
      trainer:
        max_epochs: 14
  optimizer:
    lr: 5.0e-4
    weight_decay: 1.0e-4
  # Fits a single-stage 24h JASMIN A100 job with forecast-14-history-3, batch_size 1, bf16 (44 min/epoch)
  trainer:
    max_epochs: 29
    precision: bf16-mixed
