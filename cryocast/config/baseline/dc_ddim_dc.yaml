# @package _global_
defaults:
  - /base
  - override /model: dc_ddim_dc
  - override /train/optimizer: ddpm
  - override /train/scheduler: ddpm
  - _self_

train:
  multistage:
    finetune:
      optimizer:
        lr: 5e-5  # set to lower than for the other stages
  optimizer:
    lr: 5e-4
    weight_decay: 1e-4
