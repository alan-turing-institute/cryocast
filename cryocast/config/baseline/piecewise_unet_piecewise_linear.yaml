# @package _global_
defaults:
  - /base
  - override /model: piecewise_unet_piecewise_linear
  - _self_

# Custom learning rate and weight decay
train:
  # Fits in two multistage 24h JASMIN A100 jobs with forecast-14-history-3, batch_size 1, bf16
  # First job: encoders (n/a), decoder (18 min/epoch)
  # Second job: processor (98 min/epoch), finetune (98 min/epoch)
  multistage:
    encoders:
      scheduler:
        T_max: 1
      trainer:
        max_epochs: 1
    decoder:
      scheduler:
        T_max: 22
      trainer:
        max_epochs: 22
    processor:
      scheduler:
        T_max: 7
      trainer:
        max_epochs: 7
    finetune:
      optimizer:
        lr: 5.0e-3  # 0.1 * learning rate used elsewhere
      scheduler:
        T_max: 6
      trainer:
        max_epochs: 6
  optimizer:
    lr: 5.0e-2
    weight_decay: 1.0e-2
  # Fits a single-stage 24h JASMIN A100 job with forecast-14-history-3, batch_size 1, bf16 (98 min/epoch)
  trainer:
    max_epochs: 13
