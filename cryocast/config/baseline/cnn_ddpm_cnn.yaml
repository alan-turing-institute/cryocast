# @package _global_
defaults:
  - /base
  - override /model: cnn_ddpm_cnn
  - override /train/optimizer: ddpm
  - override /train/scheduler: ddpm
  - _self_

train:
  # Fits in two multistage 24h JASMIN A100 jobs with forecast-14-history-3, batch_size 1, bf16
  # First job: encoders (37 min/epoch), decoder (19 min/epoch)
  # Second job: processor (262 min/epoch), finetune (263 min/epoch)
  multistage:
    encoders:
      scheduler:
        T_max: 23
      trainer:
        max_epochs: 23
    decoder:
      scheduler:
        T_max: 23
      trainer:
        max_epochs: 23
    processor:
      scheduler:
        T_max: 2
      trainer:
        max_epochs: 2
    finetune:
      optimizer:
        lr: 2.5e-5  # 0.1 * learning rate used elsewhere
      scheduler:
        T_max: 2
      trainer:
        max_epochs: 2
  optimizer:
    lr: 2.5e-4
    weight_decay: 5.0e-3
  # Note: this baseline cannot be run in single-stage mode
