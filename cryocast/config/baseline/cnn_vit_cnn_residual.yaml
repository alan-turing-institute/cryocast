# @package _global_
defaults:
  - /base
  - override /model: cnn_vit_cnn_residual
  - _self_

# Custom learning rate and weight decay
train:
  optimizer:
    lr: 1.5e-04
    weight_decay: 1e-02
  # Fits a single-stage 24h JASMIN A100 job with forecast-14-history-3, batch_size 1, bf16 (59 min/epoch)
  trainer:
    max_epochs: 21
