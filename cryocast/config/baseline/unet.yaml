# @package _global_
defaults:
  - /base
  - override /model: unet
  - _self_

# Custom learning rate and weight decay
train:
  optimizer:
    lr: 1.5e-4
    weight_decay: 1.5e-2
  # Fits a single-stage 24h JASMIN A100 job with forecast-14-history-3, batch_size 1, bf16 (125 min/epoch)
  trainer:
    max_epochs: 10
