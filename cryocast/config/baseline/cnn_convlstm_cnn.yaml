# @package _global_
defaults:
  - /base
  - override /model: cnn_convlstm_cnn
  - _self_

# Custom learning rate and weight decay
train:
  optimizer:
    lr: 5e-04
    weight_decay: 1e-03
  # Fits a single-stage 24h JASMIN A100 job with forecast-14-history-3, batch_size 1, bf16 (40 min/epoch)
  trainer:
    max_epochs: 31
