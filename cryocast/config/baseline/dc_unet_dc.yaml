# @package _global_
defaults:
  - /base
  - override /loss: huber
  - override /model: dc_unet_dc
  - _self_

train:
  multistage:
    finetune:
      optimizer:
        lr: 1e-5  # set to lower than for the other stages
  optimizer:
    lr: 5e-5
    weight_decay: 1e-06
  # Fits a single-stage 24h JASMIN A100 job with forecast-14-history-3, batch_size 1, bf16 (104 min/epoch)
  trainer:
    max_epochs: 12
