# @package _global_
defaults:
  - /base
  - override /loss: huber
  - override /model: cnn_unet_cnn
  - _self_

# Custom learning rate and weight decay
train:
  # Fits in two multistage 24h JASMIN A100 jobs with forecast-14-history-3, batch_size 1, bf16
  # First job: encoders (39 min/epoch), decoder (19 min/epoch)
  # Second job: processor (52 min/epoch), finetune (52 min/epoch)
  multistage:
    encoders:
      scheduler:
        T_max: 22
      trainer:
        max_epochs: 22
    decoder:
      scheduler:
        T_max: 22
      trainer:
        max_epochs: 22
    processor:
      scheduler:
        T_max: 12
      trainer:
        max_epochs: 12
    finetune:
      optimizer:
        lr: 1.5e-5  # 0.1 * learning rate used elsewhere
      scheduler:
        T_max: 12
      trainer:
        max_epochs: 12
  optimizer:
    lr: 1.5e-4
    weight_decay: 1.5e-4
  # Fits a single-stage 24h JASMIN A100 job with forecast-14-history-3, batch_size 1, bf16 (53 min/epoch)
  trainer:
    max_epochs: 24
