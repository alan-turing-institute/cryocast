# @package _global_
defaults:
  - /base
  - override /model: cnn_ddim_cnn
  - override /train/optimizer: ddpm
  - override /train/scheduler: ddpm
  - _self_

train:
  # Fits in two multistage 24h JASMIN A100 jobs with forecast-14-history-3, batch_size 1, bf16
  # First job: encoders (40 min/epoch), decoder (19 min/epoch)
  # Second job: processor (73 min/epoch), finetune (73 min/epoch)
  multistage:
    encoders:
      scheduler:
        T_max: 22
      trainer:
        max_epochs: 22
    decoder:
      scheduler:
        T_max: 22
      trainer:
        max_epochs: 22
    processor:
      scheduler:
        T_max: 9
      trainer:
        max_epochs: 9
    finetune:
      optimizer:
        lr: 5e-5  # set to lower than for the other stages
      scheduler:
        T_max: 8
      trainer:
        max_epochs: 8
  optimizer:
    lr: 2.5e-4
    weight_decay: 1e-2
