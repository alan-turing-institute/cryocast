# @package _global_
defaults:
  - /base
  - override /model: cnn_gsta_cnn
  - _self_

# Custom learning rate and weight decay
train:
  # Fits in two multistage 24h JASMIN A100 jobs with forecast-14-history-3, batch_size 1, bf16
  # First job: encoders (39 min/epoch), decoder (16 min/epoch)
  # Second job: processor (31 min/epoch), finetune (33 min/epoch)
  multistage:
    encoders:
      scheduler:
        T_max: 23
      trainer:
        max_epochs: 23
    decoder:
      scheduler:
        T_max: 23
      trainer:
        max_epochs: 23
    processor:
      scheduler:
        T_max: 21
      trainer:
        max_epochs: 21
    finetune:
      optimizer:
        lr: 5.0e-5  # 0.1 * learning rate used elsewhere
      scheduler:
        T_max: 19
      trainer:
        max_epochs: 19
  optimizer:
    lr: 5.0e-4
    weight_decay: 1.0e-2
  # Fits a single-stage 24h JASMIN A100 job with forecast-14-history-3, batch_size 1, bf16 (32 min/epoch)
  trainer:
    max_epochs: 39
    precision: bf16-mixed
