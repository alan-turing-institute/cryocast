# @package _global_
defaults:
  - /base
  - override /model: dc_gsta_dc
  - _self_

# Custom learning rate and weight decay
train:
  optimizer:
    lr: 5e-05
    weight_decay: 1e-04
  # Fits a single-stage 24h JASMIN A100 job with forecast-14-history-3, batch_size 1, bf16 (60 min/epoch)
  trainer:
    max_epochs: 21
