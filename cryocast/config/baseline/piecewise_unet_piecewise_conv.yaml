# @package _global_
defaults:
  - /base
  - override /model: piecewise_unet_piecewise_conv
  - _self_

# Custom learning rate and weight decay
train:
  # Fits in two multistage 24h JASMIN A100 jobs with forecast-14-history-3, batch_size 1, bf16
  # First job: encoders (41 min/epoch), decoder (19 min/epoch)
  # Second job: processor (75 min/epoch), finetune (75 min/epoch)
  multistage:
    encoders:
      scheduler:
        T_max: 21
      trainer:
        max_epochs: 21
    decoder:
      scheduler:
        T_max: 21
      trainer:
        max_epochs: 21
    processor:
      scheduler:
        T_max: 9
      trainer:
        max_epochs: 9
    finetune:
      optimizer:
        lr: 5.0e-4  # 0.1 * learning rate used elsewhere
      scheduler:
        T_max: 8
      trainer:
        max_epochs: 8
  optimizer:
    lr: 5.0e-3
    weight_decay: 1.0e-2
  # Fits a single-stage 24h JASMIN A100 job with forecast-14-history-3, batch_size 1, bf16 (75 min/epoch)
  trainer:
    max_epochs: 17
