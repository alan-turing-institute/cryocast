# @package _global_
defaults:
  - /base
  - override /model: piecewise_unet_piecewise_conv
  - _self_

# Custom learning rate and weight decay
train:
  optimizer:
    lr: 5e-03
    weight_decay: 1e-02
  # Fits a single-stage 24h JASMIN A100 job with forecast-14-history-3, batch_size 1, bf16 (75 min/epoch)
  trainer:
    max_epochs: 17
