# @package _global_
defaults:
  - /base
  - override /model: dc_ddpm_dc
  - override /train/optimizer: ddpm
  - override /train/scheduler: ddpm
  - _self_

train:
  # Fits in two multistage 24h JASMIN A100 jobs with forecast-14-history-3, batch_size 1, bf16
  # First job: encoders (52 min/epoch), decoder (21 min/epoch)
  # Second job: processor (268 min/epoch), finetune (276 min/epoch)
  multistage:
    encoders:
      scheduler:
        T_max: 17
      trainer:
        max_epochs: 17
    decoder:
      scheduler:
        T_max: 17
      trainer:
        max_epochs: 17
    processor:
      scheduler:
        T_max: 2
      trainer:
        max_epochs: 2
    finetune:
      optimizer:
        lr: 5.0e-5  # 0.1 * learning rate used elsewhere
      scheduler:
        T_max: 2
      trainer:
        max_epochs: 2
  optimizer:
    lr: 5.0e-4
    weight_decay: 1.0e-4
  # Note: this baseline cannot be run in single-stage mode
  trainer:
    precision: bf16-mixed
