# @package _global_
defaults:
  - /base
  - override /model: ddpm
  - override /train/optimizer: ddpm
  - override /train/scheduler: ddpm
  - _self_

train:
  # Note: this baseline cannot be run in multistage mode
  optimizer:
    lr: 5.0e-4
    weight_decay: 1.0e-2
  # Fits in two single-stage 24h JASMIN A100 jobs with forecast-14-history-3, batch_size 1, bf16 (631 min/epoch)
  trainer:
    max_epochs: 4
    precision: bf16-mixed
