<text x="48" y="59" fill="#374151" font-size="15">14-day autoregressive forecast, two seeds, 20 optimiser steps per run</text>
<text x="48" y="79" fill="#4b5563" font-size="13">Five held-out batches per seed; signed errors may cancel</text>
