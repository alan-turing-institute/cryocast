<svg xmlns="http://www.w3.org/2000/svg" width="960" height="565" viewBox="0 0 960 565" role="img" aria-labelledby="title desc">
<title id="title">Magnitude of mean signed SIE error by forecast lead</title>
<desc id="desc">Magnitude of the mean signed sea-ice-extent difference for each lead, averaged across two seeds. The five test samples were signed-averaged before absolute value, so cancellation is possible. Each model trained for 20 updates and was evaluated over a 14-day rollout; persistence performs better. See the extended study for mean absolute per-window error.</desc>
