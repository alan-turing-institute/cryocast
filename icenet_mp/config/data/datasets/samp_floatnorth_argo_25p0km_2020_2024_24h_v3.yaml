samp-floatnorth-argo-25p0km-2020-2024-24h-v3:
  name: samp-floatnorth-argo-25p0km-2020-2024-24h-v3
  group_as: float-argo
  description: ARGO float data for northern hemisphere
  attribution: ARGO
  licence: CC-BY-4.0

  dates:
    start: '2020-01-01T12:00:00'
    end: '2024-07-31T12:00:00'
    frequency: 24h
    # To reduce size, we only include the data ranges needed by the sample split
    missing:
    - start: 2022-01-01T12:00:00
      end: 2022-06-30T12:00:00
    - start: 2022-08-01T12:00:00
      end: 2022-12-31T12:00:00
    - start: 2023-02-01T12:00:00
      end: 2023-12-31T12:00:00
    - start: 2024-02-01T12:00:00
      end: 2024-06-30T12:00:00

  # Keep normalisation statistics within the training split.
  statistics:
    end: '2021-12-31T12:00:00'

  input:
    pipe:
      # Get the ARGO data
      - argo:
          area: "90/-180/0/180"  # northern hemisphere
          crs: "EPSG:6931"
          param:
            - TEMP # temperature
            - PSAL # salinity
          resolution: "25p0km"
          shape: [432, 432]
      # Replace NaNs with a fill value
      - nan-to-num:
          variables: [TEMP, PSAL]
          replace_with: 99
      # Set the geography to EASE2 25km grid
      - set-geography:
          crs: ${...0.argo.crs}
          resolution: ${...0.argo.resolution}
