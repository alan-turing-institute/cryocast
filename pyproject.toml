[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[project]
name = "cryocast"
version = "2026.10"
description = "CryoCast multimodal pipeline for predicting sea ice."
readme = "README.md"
authors = [
    { name = "Sophie Arana", email = "arana.sophie@gmail.com" },
    { name = "Simon Driscoll", email = "simondriscoll88@gmail.com" },
    { name = "Isabel Fenton", email = "ifenton@turing.ac.uk" },
    { name = "Lydia France", email = "85945427+LydiaFrance@users.noreply.github.com" },
    { name = "Aoife Hughes", email = "aoife.1.hughes@gmail.com"},
    { name = "Maria Carolina Novitasari", email ="124182131+marianovitasari20@users.noreply.github.com" },
    { name = "Nilo Pedrazzini", email = "npedrazzini@turing.ac.uk" },
    { name = "Erin Quan", email = "72717299+erinuclkwon@users.noreply.github.com" },
    { name = "James Robinson", email = "james.em.robinson@gmail.com" },
    { name = "Shaerdan Shataer", email = "Shaerdan@gmail.com"},
    { name = "Louisa van Zeeland", email = "louisa-ai2@protonmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "anemoi-datasets==0.5.47",  # note that no version is compatible with Python 3.14
    "anemoi-transform==0.5.1",
    "anemoi-utils==0.5.14",
    "argopy==1.5.0",
    "cdsapi==0.7.7", # indirect: CDS client used by anemoi-datasets for ERA5 downloads
    "earthkit-data==0.20.0",
    "eccodeslib==2.47.3.21", # indirect: binary libeccodes needed for ERA5 GRIB downloads
    "filelock==4.2.4",
    "haversine==2.9.0",
    "hydra-core==1.3.8",
    "imageio-ffmpeg==0.6.0",
    "jaxtyping==0.3.11",
    "lightning==2.6.6",
    "matplotlib==3.11.2",
    "netcdf4==1.7.5",
    "numpy==2.4.6", # jaxtyping NDArray[...] syntax raises TypeErrors under numpy>=2.5
    "omegaconf==2.3.1",
    "optuna==5.0.0",
    "pandas==2.3.3",
    "pillow==13.0.0",
    "pydantic==2.14.1",
    "pyproj==3.7.2",
    "pytorch-triton==3.5.1; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')", # restricted to known machine types.
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "torch==2.14.1",
    "torchmetrics==1.9.0",
    "tqdm==4.70.1",
    "typer==0.27.3",
    "typing-extensions==4.16.0",
    "wandb==0.31.0",
    "xarray==2026.9.0",
    "zarr==2.18.7", # anemoi-datasets still depends on zarr<=3
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pandas-stubs==3.0.5.260914",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-xdist==3.8.0",
    "types-cachetools==7.0.0.20260713",
    "types-pyyaml==6.0.12.20260906",
]
docs = [
    "mkdocstrings-python==2.0.10",
    "zensical==0.0.71",
]
notebooks = [
    "cartopy==0.26.0",
    "cmocean==4.0.3",
    "dask==2026.8.0",
    "ipython==9.17.1",
    "jupyter==1.1.1",
    "s2sphere==0.2.5",
    "scipy==1.17.1",
]

[project.scripts]
cryocast = "cryocast.cli:run"

[tool.coverage.paths]
source = ["cryocast/"]

[tool.coverage.run]
relative_files = true
omit= [
  "tests/*",
]

[tool.mypy]
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
addopts = [
    "--cov=cryocast",
    "--cov-report=term-missing",
    "-vvv",
    "-n",
    "auto",
]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
]

[tool.ruff]
line-length = 88
exclude = ["notebooks/*ipynb"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with formatter
    "CPY001", # per-file copyright notice is unnecessary noise
    "D100", # undocumented-public-module
    "D101", # undocumented-public-class
    "D102", # undocumented-public-method
    "D104", # undocumented-public-package
    "D203", # one-blank-line-before-class [conflicts with D211]
    "D213", # multi-line-summary-second-line [conflicts with D212]
    "D401", # non-imperative-mood
    "E501", # line-too-long
    "SLF001", # private-member-access
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["F"] # allow `import torch.nn.functional as F`

[tool.ruff.lint.isort]
known-third-party = ["wandb"]

[tool.ruff.lint.per-file-ignores]
"docs/scripts/*.py" = [
    "INP001", # allow implicit namespace for docs scripts
    "T201",   # allow print statements in docs scripts
]
"tests/**/*.py" = [
    "DTZ001", # allow unlocalised datetimes in tests
    "S101", # allow asserts in tests
    "INP001", # allow implicit namespace in tests
    "PLR0913", # allow unlimited arguments in tests
    "PLR0917", # allow unlimited positional arguments in tests
    "PLR2004", # allow magic-number comparison in tests
]

[tool.ruff.lint.pylint]
max-args = 6

[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.14.4", # Fixes GitHub advisories: GHSA-f9xw-jh8m-3mwq, GHSA-6cjc-53gc-5rqm, GHSA-gx76-c99x-2c96, GHSA-9xw5-w5jj-pvcg, GHSA-pqxq-w44r-73xw, GHSA-494j-54xm-rwp3, GHSA-5wr8-gcqf-gqf3, GHSA-2g87-pp6c-29x5
    "setuptools>=84.1.0", # Fixes GitHub advisory: GHSA-xmj3-9gf7-h52w
    "urllib3>=2.8.0", # Fixes GitHub advisories: GHSA-vxq7-64xx-v4gw, GHSA-8988-9cw3-xx77, GHSA-gh4c-6fx4-qh6g
]

[tool.uv.build-backend]
module-root = ""

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.sources]
pytorch-triton = [
    # Baskerville
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    # DGX Spark
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and 'nvidia' in platform_release" },
    # IsambardAI
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and 'nvidia' not in platform_release" },
]
pytorch-triton-xpu = { index = "pytorch-xpu" }
torch = [
    # Baskerville
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    # DGX Spark
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and 'nvidia' in platform_release" },
    # IsambardAI
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and 'nvidia' not in platform_release" },
]
triton = [
    # Baskerville
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    # DGX Spark
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and 'nvidia' in platform_release" },
    # IsambardAI
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and 'nvidia' not in platform_release" },
]
