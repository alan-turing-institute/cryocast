[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[project]
name = "cryocast"
version = "2026-07"
description = "CryoCast multimodal pipeline for predicting sea ice."
readme = "README.md"
authors = [
    { name = "Sophie Arana", email = "arana.sophie@gmail.com" },
    { name = "Simon Driscoll", email = "simondriscoll88@gmail.com" },
    { name = "Isabel Fenton", email = "ifenton@turing.ac.uk" },
    { name = "Lydia France", email = "85945427+LydiaFrance@users.noreply.github.com" },
    { name = "Aoife Hughes", email = "aoife.1.hughes@gmail.com"},
    { name = "Maria Carolina Novitasari", email ="124182131+marianovitasari20@users.noreply.github.com" },
    { name = "Nilo Pedrazzini", email = "npedrazzini@turing.ac.uk" },
    { name = "Erin Quan", email = "72717299+erinuclkwon@users.noreply.github.com" },
    { name = "James Robinson", email = "james.em.robinson@gmail.com" },
    { name = "Shaerdan Shataer", email = "Shaerdan@gmail.com"},
    { name = "Louisa van Zeeland", email = "louisa-ai2@protonmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "anemoi-datasets>=0.5.39,!=0.5.40", # 0.5.40 crashes on any dataset with missing dates. This behaviour is tested in test_anemoi_datasets.py
    "anemoi-transform>=0.4.1",
    "anemoi-utils>=0.5.9",
    "argopy>=1.4.0",
    "cdsapi>=0.7.6",
    "earthkit-data>=0.20.0",
    "eccodeslib>=2.47.3.21", # binary libeccodes needed to support ERA5 GRIB downloads
    "filelock>=3.32.2",
    "haversine>=2.9.0",
    "hydra-core>=1.3.3",
    "imageio-ffmpeg>=0.6.0",
    "jaxtyping>=0.3.11",
    "lightning>=2.6.0,!=2.6.2,!=2.6.3", # 2.6.2 and 2.6.3 are compromised https://www.aikido.dev/blog/pytorch-lightning-pypi-compromise-mini-shai-hulud
    "matplotlib>=3.11.1",
    "netcdf4>=1.7.0",
    "numpy>=2.4.6,<2.5", # jaxtyping NDArray[...] syntax raises TypeErrors under numpy>=2.5
    "omegaconf>=2.3.1",
    "optuna>=4.9.0",
    "pandas>=2.3.3",
    "pillow>=11.3.0",
    "pydantic>=2.11.7",
    "pyproj>=3.7.2",
    "pytorch-triton>=0.0; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')", # restricted to known machine types
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "torch>=2.11.0", # https://github.com/advisories/GHSA-rrmf-rvhw-rf47 requires >=2.10.0. 2.10.0 has broken metadata https://github.com/astral-sh/uv/issues/17711
    "torchmetrics>=1.9.0",
    "tqdm>=4.68.0",
    "typer>=0.27.1",
    "typing-extensions>=4.16.0",
    "wandb>=0.28.1",
    "xarray>=2025.3.0",
    "zarr>=2.18", # anemoi-datasets==0.5.37 still depends on zarr<=3
]

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "types-cachetools>=7.0.0.20260518",
    "types-pyyaml>=6.0.12.20260518",
]
docs = [
    "mkdocstrings-python>=2.0.5",
    "zensical>=0.0.53",
]
notebooks = [
    "cartopy>=0.26.0",
    "cmocean>=4.0.3",
    "h5py>=3.16.0",
    "jupyter>=1.1.1",
    "s2sphere>=0.2.5",
]

[project.scripts]
cryocast = "cryocast.cli:run"

[tool.coverage.paths]
source = ["cryocast/"]

[tool.coverage.run]
relative_files = true
omit= [
  "tests/*",
]

[tool.mypy]
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
addopts = [
    "--cov=cryocast",
    "--cov-report=term-missing",
    "-vvv",
    "-n",
    "auto",
]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
]

[tool.ruff]
line-length = 88
exclude = ["notebooks/*ipynb"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with formatter
    "CPY001", # per-file copyright notice is unnecessary noise
    "D100", # undocumented-public-module
    "D101", # undocumented-public-class
    "D102", # undocumented-public-method
    "D104", # undocumented-public-package
    "D203", # one-blank-line-before-class [conflicts with D211]
    "D213", # multi-line-summary-second-line [conflicts with D212]
    "D401", # non-imperative-mood
    "E501", # line-too-long
    "SLF001", # private-member-access
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["F"] # allow `import torch.nn.functional as F`

[tool.ruff.lint.isort]
known-third-party = ["wandb"]

[tool.ruff.lint.per-file-ignores]
"validation/norm-evaluation-575-extended/*.py" = ["INP001"] # standalone numerical experiments, not importable packages
"docs/scripts/*.py" = [
    "INP001", # allow implicit namespace for docs scripts
    "T201",   # allow print statements in docs scripts
]
"tests/**/*.py" = [
    "DTZ001", # allow unlocalised datetimes in tests
    "S101", # allow asserts in tests
    "INP001", # allow implicit namespace in tests
    "PLR0913", # allow unlimited arguments in tests
    "PLR0917", # allow unlimited positional arguments in tests
    "PLR2004", # allow magic-number comparison in tests
]

[tool.ruff.lint.pylint]
max-args = 6

[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.14.3", # Fixes GitHub advisories: GHSA-2fqr-mr3j-6wp8, GHSA-9x8q-7h8h-wcw9, GHSA-69f9-5gxw-wvc2, GHSA-mqqc-3gqh-h2x8, GHSA-fh55-r93g-j68g, GHSA-54jq-c3m8-4m76, GHSA-2vrm-gr82-f7m5, GHSA-mwh4-6h8g-pg8w, GHSA-966j-vmvw-g2g9, GHSA-4m7w-qmgq-4wj5, GHSA-3wq7-rqq7-wx6j, GHSA-m6qw-4cw2-hm4m, GHSA-hcc4-c3v8-rx92, GHSA-63hf-3vf5-4wqf, GHSA-hpj7-wq8m-9hgp, GHSA-c427-h43c-vf67, GHSA-hg6j-4rv6-33pg, GHSA-jg22-mg44-37j8, GHSA-jj3x-wxrx-4x23, GHSA-g84x-mcqj-x9qq, GHSA-6jhg-hg63-jvvf, GHSA-g3cq-j2xw-wf74, GHSA-4fvr-rgm6-gqmc, GHSA-p998-jp59-783m, GHSA-xcgm-r5h9-7989, GHSA-63hw-fmq6-xxg2, GHSA-m5qp-6w8w-w647, GHSA-w2fm-2cpv-w7v5, GHSA-6mq8-rvhq-8wgg, GHSA-mfx4-hv73-q22v, GHSA-mq44-7p77-q5h7, GHSA-cq5v-8q36-5273
    "eckitlib<=2.1.0.21", # required by anemoi-datasets
    "erddapy!=3.3.0,!=3.3.1", # required by argopy. argopy<=1.4.0 requires erddapy.erddapy._quote_string_constraints which are removed in 3.3.0
    "odclib<=1.6.3.21", # required by anemoi-datasets
    "urllib3>=2.8.0", # Fixes GitHub advisories: GHSA-pq67-6m6q-mj2v, GHSA-8988-9cw3-xx77, GHSA-qccp-gfcp-xxvc, GHSA-vxq7-64xx-v4gw, GHSA-gm62-xv2j-4w53, GHSA-2xpw-w6gg-jr37, GHSA-38jv-5279-wg99
]

[tool.uv.build-backend]
module-root = ""

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.sources]
pytorch-triton = [
    # Baskerville
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    # DGX Spark
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and 'nvidia' in platform_release" },
    # IsambardAI
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and 'nvidia' not in platform_release" },
]
pytorch-triton-xpu = { index = "pytorch-xpu" }
torch = [
    # Baskerville
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    # DGX Spark
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and 'nvidia' in platform_release" },
    # IsambardAI
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and 'nvidia' not in platform_release" },
]
triton = [
    # Baskerville
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    # DGX Spark
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and 'nvidia' in platform_release" },
    # IsambardAI
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and 'nvidia' not in platform_release" },
]
